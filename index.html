key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.s),iterations:250000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]),
o=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.i)},key,b(P.d));return new TextDecoder().decode(o)}
async function go(pw,quiet){try{const h=await open_(pw);sessionStorage.setItem("gate",pw);document.open();document.write(h);document.close()}catch(x){if(!quiet){document.getElementById("e").textContent="Incorrect password.";document.getElementById("g").disabled=false}}}
document.getElementById("f").onsubmit=e=>{e.preventDefault();document.getElementById("g").disabled=true;go(document.getElementById("p").value)};
const s=sessionStorage.getItem("gate");if(s)go(s,true);
